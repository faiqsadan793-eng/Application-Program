<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350"><rect width="100%" height="100%" rx="8" fill="#0f172a"/><line x1="600" y1="0" x2="600" y2="350" stroke="#334155"/><text x="18" y="24" fill="#38bdf8" font-family="Arial,sans-serif" font-size="15" font-weight="bold">SOURCE CODE</text><text x="618" y="24" fill="#34d399" font-family="Arial,sans-serif" font-size="15" font-weight="bold">TEST CODE</text><text x="18" y="46" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        return view('rekam_medis_pasien.show', compact('pasien', 'kunjungans'));</text><text x="18" y="62" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    }</text><text x="18" y="78" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="18" y="94" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    public function export(Request $request, Pasien $pasien)</text><text x="18" y="110" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    {</text><text x="18" y="126" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $user = Auth::user();</text><text x="18" y="142" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $poli = $user-&gt;role === 'dokter' ? $user-&gt;dokter?-&gt;poli : null;</text><text x="18" y="158" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        abort_if($user-&gt;role === 'dokter' &amp;&amp; ! $poli, 403);</text><text x="18" y="174" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $query = $pasien-&gt;kunjungans()-&gt;whereHas('rekamMedis')</text><text x="18" y="190" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">            -&gt;when($poli, fn ($q) =&gt; $q-&gt;where('poli_tujuan', $poli));</text><text x="18" y="206" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        abort_unless($query-&gt;exists(), 404);</text><text x="18" y="222" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="18" y="238" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $total = $query-&gt;count();</text><text x="18" y="254" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $parts = (int) ceil($total / 50);</text><text x="18" y="270" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $validated = $request-&gt;validate(['bagian' =&gt; ['nullable', 'integer', 'min:1', 'max:'.$parts]]);</text><text x="18" y="286" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        // Riwayat besar tetap lengkap melalui beberapa PDF dengan pekerjaan terbatas per unduhan.</text><text x="18" y="302" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        if ($parts &gt; 1 &amp;&amp; empty($validated['bagian'])) {</text><text x="18" y="318" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">            return redirect()-&gt;route('rekam-medis-pasien.show', $pasien)</text><text x="618" y="46" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">&lt;?php</text><text x="618" y="62" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="78" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">namespace Tests\Feature;</text><text x="618" y="94" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="110" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">use App\Models\{Dokter, Kunjungan, Pasien, RekamMedis, User};</text><text x="618" y="126" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">use Illuminate\Foundation\Testing\RefreshDatabase;</text><text x="618" y="142" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">use Tests\TestCase;</text><text x="618" y="158" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="174" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">class MedicalRecor