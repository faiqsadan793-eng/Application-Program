<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350"><rect width="100%" height="100%" rx="8" fill="#0f172a"/><line x1="600" y1="0" x2="600" y2="350" stroke="#334155"/><text x="18" y="24" fill="#38bdf8" font-family="Arial,sans-serif" font-size="15" font-weight="bold">SOURCE CODE</text><text x="618" y="24" fill="#34d399" font-family="Arial,sans-serif" font-size="15" font-weight="bold">TEST CODE</text><text x="18" y="46" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    /**</text><text x="18" y="62" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">     * Handle an incoming authentication request.</text><text x="18" y="78" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">     */</text><text x="18" y="94" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    public function store(LoginRequest $request): RedirectResponse</text><text x="18" y="110" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    {</text><text x="18" y="126" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $request-&gt;authenticate();</text><text x="18" y="142" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="18" y="158" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $request-&gt;session()-&gt;regenerate();</text><text x="18" y="174" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="18" y="190" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        return redirect()-&gt;intended(route('dashboard', absolute: false));</text><text x="18" y="206" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    }</text><text x="18" y="222" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="18" y="238" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    /**</text><text x="18" y="254" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">     * Destroy an authenticated session.</text><text x="18" y="270" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">     */</text><text x="18" y="286" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    public function destroy(Request $request): RedirectResponse</text><text x="18" y="302" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    {</text><text x="18" y="318" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        Auth::guard('web')-&gt;logout();</text><text x="618" y="46" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">&lt;?php</text><text x="618" y="62" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="78" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">namespace Tests\Feature\Auth;</text><text x="618" y="94" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="110" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">use App\Models\User;</text><text x="618" y="126" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">use Illuminate\Foundation\Testing\RefreshDatabase;</text><text x="618" y="142" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">use Tests\TestCase;</text><text x="618" y="158" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="174" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">class AuthenticationTest extends TestCase</text><text x="618" y="190" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">{</text><text x="618" y="206" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    use RefreshDatabase;</text><text x="618" y="222" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="238" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    public function test_login_screen_can_be_rendered(): void</text><text x="618" y="254" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    {</text><text x="618" y="270" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $response = $this-&gt;get('/login');</text><text x="618" y="286" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11"> </text><text x="618" y="302" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">        $response-&gt;assertStatus(200);</text><text x="618" y="318" fill="#e2e8f0" font-family="Consolas,monospace" font-size="11">    }</text></svg>