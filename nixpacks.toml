providers = ["php", "node"]

[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo",
    "php84Extensions.pdo_mysql",
    "php84Extensions.mbstring",
    "php84Extensions.gd",
    "php84Extensions.intl",
    "php84Extensions.bcmath",
    "php84Extensions.exif",
    "php84Extensions.zip",
    "composer",
    "nodejs_20"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=php+",
    "npm ci --prefer-offline --no-audit || npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
