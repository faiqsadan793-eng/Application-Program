services:
  # ----------------------------------------------------
  # 1. Laravel Application Service (PHP 8.3 FPM)
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eklinik-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eklinik-net

  # ----------------------------------------------------
  # 2. Web Server (Nginx)
  # ----------------------------------------------------
  webserver:
    image: nginx:alpine
    container_name: eklinik-webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - eklinik-net

  # ----------------------------------------------------
  # 3. Database Service (MariaDB 10.11 LTS)
  # ----------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: eklinik-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_eklinik_ta}
      MYSQL_USER: ${DB_USERNAME:-eklinik_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-klinik123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootklinik123}
    volumes:
      - db_data:/var/lib/mysql
      # Auto-import database awal saat container pertama kali dibuat jika ada file .sql
      - ./db_eklinik_ta.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    networks:
      - eklinik-net

  # ----------------------------------------------------
  # 4. Background Queue Worker (Optional but recommended)
  # ----------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eklinik-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - eklinik-net

  # ----------------------------------------------------
  # 5. phpMyAdmin (Database Web GUI)
  # ----------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: eklinik-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eklinik-net

  # ----------------------------------------------------
  # 6. Cloudflare Quick Tunnel (Public HTTPS Random URL)
  # ----------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: eklinik-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://webserver:80
    depends_on:
      - webserver
    networks:
      - eklinik-net

# ------------------------------------------------------
# Networks & Volumes Definition
# ------------------------------------------------------
networks:
  eklinik-net:
    driver: bridge

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local
